# Publishes the dashboard to GitHub Pages on every push to main.
#
# The site is the repository root: index.html is entirely self-contained, so
# there is nothing to build — the artifact is the file itself.
#
# `enablement: true` asks configure-pages to turn Pages on via the API using
# this workflow's token, so the site can be stood up without anyone visiting
# the settings page. That call needs the repository to be public, or a plan
# that permits Pages on a private repository; it fails cleanly otherwise.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live rollout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
